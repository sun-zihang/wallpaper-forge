name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    name: desktop tests (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        run: python -m pytest -q --cov=core --cov=gui --cov-report=term --cov-fail-under=93
        env:
          QT_QPA_PLATFORM: offscreen

  web:
    name: web tests (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run node tests (coverage gate ≥95%)
        run: >
          node --test --experimental-test-coverage
          --test-coverage-include='web/lib/**'
          --test-coverage-lines=95
          web/tests/*.test.mjs
      - name: JS syntax check
        run: |
          set -e
          for f in $(find web \( -name '*.js' -o -name '*.mjs' \)); do
            node --check "$f"
          done

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff==0.16.9
      - name: ruff check
        run: python -m ruff check .
      - name: ruff format --check
        run: python -m ruff format --check .

  cdn-pins:
    name: cdn pins reachable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Every pinned CDN mirror must answer
        run: node scripts/check_cdn.mjs
