name: Release build

on:
  workflow_dispatch:
    inputs:
      create_draft_release:
        description: "Also create a draft GitHub release with the installer attached"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Check release version consistency
        run: python -m pytest tests/test_release_meta.py -q

      - name: Build app (PyInstaller)
        run: python -m PyInstaller build/app.spec --noconfirm

      - name: Locate or install Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after install" }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Compile installer (Inno Setup)
        run: '& "$env:ISCC" build\installer.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WallpaperConverter-Setup
          path: build/Output/WallpaperConverter-Setup-*.exe
          if-no-files-found: error

      - name: Create draft release
        if: ${{ inputs.create_draft_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = (Select-String -Path core/version.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $exe = (Get-Item build/Output/WallpaperConverter-Setup-*.exe).FullName
          gh release create "v$ver" --draft --title "v$ver" --generate-notes $exe
