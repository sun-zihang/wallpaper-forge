name: 功能建议
description: 建议新功能或改进现有功能
title: "[feature] "
body:
  - type: textarea
    id: idea
    attributes:
      label: 想要什么
      description: 使用场景、期望的行为、能解决什么问题
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现在的替代方案
      description: 目前如何绕过这个问题（可留空）
